<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Film Roll 🎞️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="film-container">
    <h1 class="title">Little Moments💭 </h1>
    <p class="subtitle">pause to feel every frame...</p>

    <div class="film-wrapper">
      <div class="film-track">
        <div class="frame"><img src="grad.jpg"><p>proudd!! ☀️</p></div>
        <div class="frame"><img src="dufan.jpg"><p>our girls timee!!! 🌊</p></div>
        <div class="frame"> <img src="ied25.jpg">just our little moment 💙</div>
        <div class="frame"><img src="goo.jpg"><p>let's go homee🎞️</p></div>
        <!-- ulang biar loop -->
       <div class="frame"><img src="grad.jpg"><p>proudd!! ☀️</p></div>
        <div class="frame"><img src="dufan.jpg"><p>our girls timee!!! 🌊</p></div>
      </div>
    </div>
  </div>

  <section class="center">
      <div style="margin-top:18px;">
        <a class="btn" href="gifts.html">← Kembali</a>
      </div>
    </section>
  <script>
    const track = document.querySelector('.film-track');
    const frames = document.querySelectorAll('.frame');
    let position = 0;
    let speed = 0.5; // kecepatan scroll
    let animationId;

    function loop() {
      position -= speed;
      track.style.transform = `translateX(${position}px)`;

      // reset supaya loop halus
      if (Math.abs(position) >= track.scrollWidth / 2) position = 0;

      // deteksi tengah layar
      const center = window.innerWidth / 2;
      frames.forEach(frame => {
        const rect = frame.getBoundingClientRect();
        const frameCenter = rect.left + rect.width / 2;
        const distance = Math.abs(center - frameCenter);
        const scale = Math.max(0.9, 1.1 - distance / 600); // yang di tengah paling besar
        frame.style.transform = `scale(${scale})`;
        frame.style.zIndex = scale > 1 ? 2 : 1;
        frame.style.opacity = Math.max(0.5, 1.2 - distance / 500);
      });

      animationId = requestAnimationFrame(loop);
    }

    loop();

    // Hover buat pause
    const container = document.querySelector('.film-container');
    container.addEventListener('mouseenter', () => cancelAnimationFrame(animationId));
    container.addEventListener('mouseleave', () => loop());
  </script>

</body>
</html>
